[project]
name = "instapaper-cli"
version = "0.1.0"
description = "Agent-friendly CLI for your Instapaper bookmarks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Akram Zaytar" }]
dependencies = ["click>=8.1", "httpx>=0.28.1"]

[project.scripts]
instapaper = "instapaper_cli.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Akramz/instapaper-cli"

[tool.ruff]
line-length = 130
